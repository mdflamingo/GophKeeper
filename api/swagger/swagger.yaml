basePath: /api
definitions:
  github_com_mdflamingo_GophKeeper_internal_model.AuthResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  github_com_mdflamingo_GophKeeper_internal_model.AuthUser:
    properties:
      login:
        example: user@example.com
        maxLength: 100
        minLength: 3
        type: string
      password:
        example: strongpassword123
        maxLength: 100
        minLength: 6
        type: string
    required:
    - login
    - password
    type: object
  github_com_mdflamingo_GophKeeper_internal_model.DataType:
    enum:
    - TEXT
    - CARD
    - FILE
    - CREDENTIALS
    type: string
    x-enum-varnames:
    - TEXT
    - CARD
    - FILE
    - CREDENTIALS
  github_com_mdflamingo_GophKeeper_internal_model.SecretCreateRequest:
    properties:
      data:
        type: object
      data_type:
        allOf:
        - $ref: '#/definitions/github_com_mdflamingo_GophKeeper_internal_model.DataType'
        example: CREDENTIALS
    type: object
  github_com_mdflamingo_GophKeeper_internal_model.SecretListResponse:
    properties:
      count:
        example: 5
        type: integer
      secrets:
        items:
          $ref: '#/definitions/github_com_mdflamingo_GophKeeper_internal_model.SecretResponse'
        type: array
    type: object
  github_com_mdflamingo_GophKeeper_internal_model.SecretResponse:
    properties:
      created_at:
        example: "2024-01-01T12:00:00Z"
        type: string
      data_type:
        allOf:
        - $ref: '#/definitions/github_com_mdflamingo_GophKeeper_internal_model.DataType'
        example: CREDENTIALS
      id:
        example: 5
        type: integer
      meta_data:
        type: object
    type: object
host: localhost:8080
info:
  contact:
    email: support@gophkeeper.com
    name: API Support
  description: API сервиса GophKeeper для безопасного хранения данных
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GophKeeper API
  version: "1.0"
paths:
  /ping:
    get:
      description: Проверяет доступность сервера и подключение к БД
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Проверка здоровья сервера
      tags:
      - monitoring
  /secret:
    post:
      consumes:
      - application/json
      description: Создает секрет текущего авторизованного пользователя
      parameters:
      - description: Данные секрета
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mdflamingo_GophKeeper_internal_model.SecretCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешное создание секрета
        "400":
          description: Неверный запрос
        "401":
          description: Пользователь не авторизован
        "500":
          description: Внутренняя ошибка сервера
      security:
      - BearerAuth: []
      summary: Создание секрета пользователя
      tags:
      - secrets
  /secret/{id}:
    get:
      consumes:
      - application/json
      description: Возвращает секрет текущего авторизованного пользователя по id секрета
      parameters:
      - description: ID секрета
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение секрета
          schema:
            $ref: '#/definitions/github_com_mdflamingo_GophKeeper_internal_model.SecretResponse'
        "204":
          description: Секрет не найден
        "400":
          description: Неверный запрос
        "401":
          description: Пользователь не авторизован
        "500":
          description: Внутренняя ошибка сервера
      security:
      - BearerAuth: []
      summary: Получение секрета пользователя
      tags:
      - secrets
  /secret/list:
    get:
      consumes:
      - application/json
      description: Возвращает список всех сохраненных секретов (данных) текущего авторизованного
        пользователя
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение списка секретов
          schema:
            $ref: '#/definitions/github_com_mdflamingo_GophKeeper_internal_model.SecretListResponse'
        "204":
          description: Нет содержимого (список секретов пуст)
        "401":
          description: Пользователь не авторизован
        "500":
          description: Внутренняя ошибка сервера
      security:
      - BearerAuth: []
      summary: Получение списка секретов пользователя
      tags:
      - secrets
  /user/login:
    post:
      consumes:
      - application/json
      description: Вход в систему с получением JWT токена
      parameters:
      - description: Учетные данные пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mdflamingo_GophKeeper_internal_model.AuthUser'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный вход, токен в cookie и теле ответа
          schema:
            $ref: '#/definitions/github_com_mdflamingo_GophKeeper_internal_model.AuthResponse'
        "400":
          description: Неверный запрос или пустые поля
        "401":
          description: Неверный логин или пароль
        "500":
          description: Внутренняя ошибка сервера
      summary: Аутентификация пользователя
      tags:
      - auth
  /user/register:
    post:
      consumes:
      - application/json
      description: Создает нового пользователя с указанным логином и паролем
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mdflamingo_GophKeeper_internal_model.AuthUser'
      produces:
      - application/json
      responses:
        "200":
          description: Успешная регистрация, токен в cookie и теле ответа
          schema:
            $ref: '#/definitions/github_com_mdflamingo_GophKeeper_internal_model.AuthResponse'
        "400":
          description: Неверный запрос или пустые поля
        "409":
          description: Пользователь с таким логином уже существует
        "500":
          description: Внутренняя ошибка сервера
      summary: Регистрация нового пользователя
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
